name: Security

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job fails on findings and lists them in its log. Uploading them to the
# repository's code scanning tab needs GitHub Advanced Security, which is free
# only for public repositories, so that step runs only once the repository is
# public, and not for pull requests from forks, which cannot upload.
env:
  UPLOAD_SARIF: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.183.0
    permissions:
      contents: read # check out the code
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Community rules only, no Semgrep account. Semgrep has no QML parser, so
      # this covers effects.sh, the JSON and the workflows; qmllint in CI
      # covers Service.qml.
      - name: Scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/default --config p/secrets --config p/github-actions --config r/bash
          --sarif-output=semgrep.sarif

      - name: Upload to code scanning
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: ${{ env.UPLOAD_SARIF }}
