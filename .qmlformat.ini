; qmlformat settings matched to Omarchy's own shell plugins: two-space indent
; and only the semicolons QML needs. qmlformat still splits one-line `if`s
; and joins short arrays onto one line; it has no option for either.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=2
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=essential
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
